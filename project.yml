name: LineriOS
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  LineriOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Liner
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.personal.linerios.auth
            CFBundleURLSchemes:
              - linerios
        LSApplicationQueriesSchemes:
          - spotify
          - spotify-action
          - sidestore
        CADisableMinimumFrameDurationOnPhone: true # Enables 120Hz ProMotion on iPhone 14 Pro
    dependencies:
      - framework: Vendor/SpotifyiOS.xcframework
        embed: true
        codeSign: false
      - sdk: libsqlite3.tbd
      - sdk: Accelerate.framework
      - sdk: AuthenticationServices.framework
      - sdk: CryptoKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.linerios
        OTHER_LDFLAGS: "-ObjC"
        SWIFT_OBJC_BRIDGING_HEADER: "Sources/Bridge/LineriOS-Bridging-Header.h"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/**"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/**"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        AD_HOC_CODE_SIGNING_ALLOWED: YES

  LineriOSUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LineriOS

schemes:
  LineriOS:
    build:
      targets:
        LineriOS: all
    test:
      targets:
        - LineriOSUnitTests
    run:
      config: Debug
